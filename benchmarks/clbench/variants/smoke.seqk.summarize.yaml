# clbench smoke: one task, seq@3 with raw feedback + self-summarization.
# Cheapest way to eyeball the feature — check that attempt-2/3 prompts carry
# <AttemptSummary i> blocks and that attempt JSON has a `summarizer` section.
metric: seq@k
k: 3
feedback_mode: raw
model: openai/gpt-4o-mini
judge_model: openai/gpt-4o-mini
temperature: 0.7
max_tasks: 1
console_char_limit: 3000
s3_sync: false
summarize: true
summary_max_words: 150
