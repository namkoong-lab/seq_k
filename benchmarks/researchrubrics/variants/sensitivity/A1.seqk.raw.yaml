# A1 BASELINE for every ablation below. seq@k, raw feedback, horizon on, no summary.
# Each arm A2-A5 changes exactly ONE factor from this.
metric: seq@k
# Pinned to the unversioned prompt template these results were produced under.
# Without it a re-run defaults to prompt=v1, a different fingerprint, and would
# redo completed work instead of resuming. Bump when the template changes.
prompt_variant: v1
feedback_mode: raw
model: openrouter/deepseek/deepseek-chat
k: 5
judge_model: openrouter/google/gemini-3-flash-preview   # FIXED across every arm so comparisons
                                                 #   aren't confounded by grading differences
temperature: 0.7
max_tasks: 30
console_char_limit: 0
s3_sync: false
runs_root: runs/sensitivity
