# k=10 sweep: qwen3-max, pass@k. Replaces sonnet-4.5, which was retired: it wrote
# 6.6k-20.8k token answers to a 641-char question, blowing seq@k context to 172k
# tokens by attempt 10 and running at 0.36 att/min. qwen3-max answers in ~2.4k tokens.
metric: pass@k
# Pinned to the unversioned prompt template these results were produced under.
# Without it a re-run defaults to prompt=v1, a different fingerprint, and would
# redo completed work instead of resuming. Bump when the template changes.
prompt_variant: v1
feedback_mode: raw
model: openrouter/qwen/qwen3-max
k: 10
judge_model: openrouter/google/gemini-3-flash-preview
temperature: 0.7
max_tasks: 30
console_char_limit: 0
s3_sync: false
runs_root: runs
