# HealthBench ablation — pass@k reference: k independent feedback-blind draws
# Mirrors the ResearchRubrics A-grid exactly, so findings can be checked ACROSS BENCHMARKS.
# judge held at gemini-3-flash for comparability.
metric: pass@k
# Pinned to the unversioned prompt template these results were produced under.
# Without it a re-run defaults to prompt=v1, a different fingerprint, and would
# redo completed work instead of resuming. Bump when the template changes.
prompt_variant: v1
feedback_mode: raw
model: openrouter/deepseek/deepseek-chat
k: 5
judge_model: openrouter/google/gemini-3-flash-preview
temperature: 0.7
max_tasks: 30
console_char_limit: 3000
s3_sync: false
runs_root: runs/hb_ablation
