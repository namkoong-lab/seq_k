# banking_knowledge — seq@k on the SAME 10-task subset as banking.sub10.passk.
# Identical config except metric + feedback, so any difference is attributable to
# feedback. RAG via bm25_grep (KB_search + grep, offline). Short-circuits on pass.
metric: seq@k
k: 5
feedback_mode: raw                # public per-check failure summary fed to next attempt
model: anthropic/claude-sonnet-4-6
temperature: 0.7
console_char_limit: 3000
options:
  domain: banking_knowledge
  split: base
  tasks: "task_001,task_002,task_003,task_004,task_005,task_006,task_007,task_008,task_010,task_012"
  retrieval_config: bm25_grep     # KB_search (bm25) + grep, both offline
  user_llm: anthropic/claude-sonnet-4-6
  user_temperature: 0.0
  max_steps: 100
  seed: 0
