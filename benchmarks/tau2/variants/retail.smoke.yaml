# tau2 retail smoke test: one task, k=1. Verifies the install, task loading, a
# full agent<->user sim, reward parsing, and the saved attempt JSON shape.
metric: pass@k
k: 1
feedback_mode: binary             # ignored under pass@k
model: anthropic/claude-sonnet-4-6
temperature: 0.7
console_char_limit: 3000
options:
  domain: retail
  split: base
  num_tasks: 1
  user_llm: anthropic/claude-sonnet-4-6
  user_temperature: 0.0
  max_steps: 100
  seed: 0
