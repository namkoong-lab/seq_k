# banking_knowledge — seq@k, k=5, 15 tasks. Same tasks/config as banking.passk
# (identical except metric + feedback), so any difference is attributable to
# feedback. RAG domain via bm25 retrieval. Short-circuits on first success.
metric: seq@k
k: 5
feedback_mode: raw                # public per-check failure summary fed to next attempt
model: anthropic/claude-sonnet-4-6
temperature: 0.7
console_char_limit: 3000
options:
  domain: banking_knowledge
  split: base
  num_tasks: 15
  retrieval_config: bm25_grep          # how the agent searches the knowledge base
  user_llm: anthropic/claude-sonnet-4-6
  user_temperature: 0.0
  max_steps: 100
  seed: 0
