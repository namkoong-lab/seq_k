# tau2 retail — seq@k on the 10 STRUCTURALLY-HARDEST tasks. This is the
# interesting comparison: on tasks that actually fail, does feedback between
# attempts (seq@k) beat independent resampling (pass@k)? Same hard subset as
# retail.hard.passk.yaml.
metric: seq@k
k: 5
feedback_mode: raw                # public per-check failure summary fed to next attempt
model: anthropic/claude-sonnet-4-6
temperature: 0.7
console_char_limit: 3000
options:
  domain: retail
  split: base
  tasks: "36,98,37,99,30,58,72,91,18,38"   # same hard subset
  user_llm: anthropic/claude-sonnet-4-6
  user_temperature: 0.0
  max_steps: 100
  seed: 0
  nl_judge_model: anthropic/claude-opus-4-5
