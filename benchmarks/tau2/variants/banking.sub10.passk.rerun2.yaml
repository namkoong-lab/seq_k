# banking_knowledge — pass@k RE-RUN with a DIFFERENT seed, to check whether the
# original pass@k=7/10 is stable or was a lucky sample (task_003 only passed @5).
# Same 10 tasks / config as banking.sub10.passk, but seed 100 (→ per-attempt seeds
# 100..104 instead of 0..4) and run_tag so it lands in its own folder.
metric: pass@k
k: 5
feedback_mode: binary
model: anthropic/claude-sonnet-4-6
temperature: 0.7
console_char_limit: 3000
options:
  domain: banking_knowledge
  split: base
  tasks: "task_001,task_002,task_003,task_004,task_005,task_006,task_007,task_008,task_010,task_012"
  retrieval_config: bm25_grep
  run_tag: rerun2
  user_llm: anthropic/claude-sonnet-4-6
  user_temperature: 0.0
  max_steps: 100
  seed: 100
